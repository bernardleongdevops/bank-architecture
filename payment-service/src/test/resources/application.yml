# Test profile: in-memory H2 so tests need no running MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:payment;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# Default tests to the in-process publisher (matching pre-outbox behaviour);
# outbox-specific tests opt in with @TestPropertySource(provider.events=outbox).
provider:
  aml: simulated
  events: in-process

outbox:
  poll-delay-ms: 1000
