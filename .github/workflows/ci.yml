name: CI

# Build and test the whole monorepo on every push and pull request.
# Tests run against in-memory H2, so no MySQL service is required here.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

  # Stubbed, manual-only deployment path. Wired but inert until container images
  # and a target environment exist (Task 12). Kept here so the pipeline shape is
  # ready and visible without doing anything yet.
  deploy-local:
      name: Deploy backend to laptop VM
      needs: build-and-test

      if: >-
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch'
        )

      runs-on: [self-hosted, linux, x64, bank-backend]

      permissions:
        contents: read

      concurrency:
        group: backend-local-deployment
        cancel-in-progress: false

      timeout-minutes: 90

      steps:
        - name: Check out tested commit
          uses: actions/checkout@v4
  
        - name: Build and deploy backend
          run: bash deploy/deploy.local.sh
   
