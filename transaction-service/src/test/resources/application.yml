# Test profile: in-memory H2 so tests need no running MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:transaction;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

# In tests the shared outbox lives in the single H2 database. H2's default schema
# is PUBLIC, so point the read-only outbox query at PUBLIC.event_outbox (created by
# the test-only V4 migration) rather than the production default sandbox_payment.
outbox:
  schema: PUBLIC
