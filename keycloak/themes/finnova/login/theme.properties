# FinNova Digital-Bank login theme.
# Extends Keycloak's built-in "keycloak" login theme so we only override branding
# and colours, not the whole page structure.
parent=keycloak
import=common/keycloak

# Load the parent theme's styles, then our overrides (finnova.css) last so ours win.
styles=css/login.css finnova.css
